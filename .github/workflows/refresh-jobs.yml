# Weekly job-postings refresh for hosts with no Celery beat (Render free).
# Postings unseen for 14 days drop out of matching, so weekly keeps every one
# fresh. Each Jooble page is one request against the key's 500-request quota:
# 8 searches x 2 pages = 16 per run, ~7 months of quota. Daily would burn it in one.
# Needs repo secrets: DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, LLM_API_KEY, JOOBLE_API_KEY.
name: Refresh job postings

on:
  schedule:
    - cron: "0 19 * * 6"  # Sundays 03:00 Philippine time
  workflow_dispatch:  # "Run workflow" button, for the first fill

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_PORT: "5432"
      PGSSLMODE: require
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b
      LLM_REASONING_EFFORT: low
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: Refresh
        working-directory: backend
        # One search per kind of resume people upload, so every one has postings
        # in its field to match against. "" is the general Philippine feed.
        run: |
          python manage.py shell <<'EOF'
          from apps.jobs.tasks import refresh_jobs
          for term in ["", "video editor", "graphic designer", "web developer",
                       "virtual assistant", "data analyst", "customer service", "accountant"]:
              print(term or "general", refresh_jobs(search=term, limit=40))
          EOF
