<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" role="img" aria-label="Resume Analyzer">
  <style>
    .ink { fill: #161a16 } .stamp { fill: #1c3faa }
    @media (prefers-color-scheme: dark) { .ink { fill: #f2f4ee } .stamp { fill: #7d97ff } }
  </style>
  <g transform="translate(0 4) scale(1.25)">
    <rect width="32" height="32" rx="7" fill="#161a16"/>
    <path d="M5.5 10.5v-5h5M21.5 5.5h5v5M26.5 21.5v5h-5M10.5 26.5h-5v-5" fill="none" stroke="#f2f4ee" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12.5 23V9.5h4.25a3.75 3.75 0 0 1 0 7.5H12.5" fill="none" stroke="#f2f4ee" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M16.5 17.5l4.25 5.5" stroke="#7d97ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- textLength pins the width whatever font renders, so the read head lands just past the text -->
