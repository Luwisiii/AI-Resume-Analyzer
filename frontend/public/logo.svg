<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" role="img" aria-label="Resume Analyzer">
  <style>
    .ink { fill: #161a16 } .stamp { fill: #1c3faa } .ghost { fill: #ccd6c8 }
    @media (prefers-color-scheme: dark) { .ink { fill: #f2f4ee } .stamp { fill: #7d97ff } .ghost { fill: #3b433b } }
    /* Same loop as the app's .readhead: sweep 28% of 5s, hold inked, rescan.
       The clip edge and the bar share one translate, so they stay together. */
    .head { animation: sweep 5s cubic-bezier(.6, 0, .3, 1) .3s infinite backwards }
    #bar { animation: sweep 5s cubic-bezier(.6, 0, .3, 1) .3s infinite backwards, fade 5s linear .3s infinite backwards }
    @keyframes sweep { from { transform: translateX(-114px) } 28%, to { transform: none } }
    @keyframes fade { from, 28% { opacity: 1 } 34%, to { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .head, #bar { animation: none } }
  </style>
  <defs>
    <!-- Right edge rests at the bar (x=263); the sweep starts it at x=149, just left of "Analyzer" in any fallback font -->
    <clipPath id="read"><rect class="head" width="263" height="48"/></clipPath>
  </defs>
  <g transform="translate(0 4) scale(1.25)">
    <rect width="32" height="32" rx="7" fill="#161a16"/>
    <path d="M5.5 10.5v-5h5M21.5 5.5h5v5M26.5 21.5v5h-5M10.5 26.5h-5v-5" fill="none" stroke="#f2f4ee" stroke-opacity=".7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M12.5 23V9.5h4.25a3.75 3.75 0 0 1 0 7.5H12.5" fill="none" stroke="#f2f4ee" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M16.5 17.5l4.25 5.5" stroke="#7d97ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Ghost copy under an inked copy clipped to the read head. textLength pins the width whatever
       font renders, so the two copies line up and the bar lands just past the text. -->
  <text x="52" y="32" textLength="206" lengthAdjust="spacingAndGlyphs" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" class="ink">Resume<tspan class="ghost"> Analyzer</tspan></text>
  <text x="52" y="32" textLength="206" lengthAdjust="spacingAndGlyphs" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" class="ink" clip-path="url(#read)">Resume<tspan class="stamp"> Analyzer</tspan></text>
  <rect id="bar" x="263" y="11" width="2.5" height="26" rx="1" class="stamp"/>
</svg>
