# Production stack for one VM. Setup: cp .env.production.example .env, fill it in,
# then `docker compose up -d --build`. See DEPLOY.md.

x-django: &django
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DEBUG: "False"
    ALLOWED_HOSTS: ${DOMAIN}
    CORS_ALLOWED_ORIGINS: https://${DOMAIN}
    DB_HOST: db
    DB_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis:6379/1
    LLM_BASE_URL: http://ollama:11434/v1
  volumes:
    - media:/app/media  # web writes uploads, worker reads them
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *django
    command: sh -c "python manage.py migrate --noinput && exec gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"

  worker:
    <<: *django
    command: celery -A core worker -l info --concurrency 2

  beat:
    <<: *django
    command: celery -A core beat -l info --schedule /tmp/celerybeat-schedule

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # TLS certs; losing them hits Let's Encrypt rate limits
    depends_on:
      - web

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"  # keep the model in RAM; reloading it costs ~30s per call
    volumes:
      - ollama:/root/.ollama

  # One-shot: downloads the model on first boot, a no-op afterwards.
  ollama-pull:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL}"]
    depends_on:
      - ollama
    restart: on-failure

volumes:
  pgdata:
  media:
  ollama:
  caddy_data:
